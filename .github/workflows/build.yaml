name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Assignment01.sln

    - name: Build Solution
      run: dotnet build Assignment01.sln --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test Assignment01.sln --no-build --configuration Release --verbosity normal
